note: >-
  Mantra Health does not run a trust center in the modern sense — there is no trust.mantrahealth.com,
  no Vanta/Drata/SafeBase portal, and no document request flow. What it publishes is a single
  marketing-site page, "Security and Privacy at Mantra Health", naming three compliance frameworks in
  prose. That page is the whole of the public posture, and it is recorded here verbatim. The
  automated probe (probe-security-programs.py) missed it because the page sits at
  /security-and-privacy/ rather than any of the conventional /trust, /security, /compliance paths;
  /security does 302 to it, which is how it was found.
