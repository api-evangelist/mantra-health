apis:
- aid: mantra-health-graphql-api
  name: Mantra Health GraphQL API
  description: >-
    The first-party Mantra Health API. The host api.mantrahealth.com answers 200 with the plain-text
    banner "Mantra Health API" and exposes a GraphQL endpoint at /graphql that is served by Apollo
    Server (it enforces Apollo CSRF prevention and returns Apollo error extension codes). The endpoint
    is reachable anonymously and answers the meta field {__typename} -> "Query", but schema
    introspection is disabled and unknown fields are rejected with a generic
    GRAPHQL_VALIDATION_FAILED / "Invalid request." response, so no schema, operation list or type
    system can be read without credentials. Mantra publishes no reference documentation for it.
  humanURL: https://mantrahealth.com/our-solutions/
  baseURL: https://api.mantrahealth.com/graphql
  tags:
  - GraphQL
  - Health Care
  - Telehealth
  properties:
  - type: RateLimits
    url: rate-limits/mantra-health-rate-limits.yml
  - type: Authentication
    url: authentication/mantra-health-authentication.yml
  - type: Conventions
    url: conventions/mantra-health-conventions.yml
- aid: mantra-health-wordpress-content-api
  name: Mantra Health WordPress Content API
  description: >-
    The WordPress REST API behind the mantrahealth.com marketing and resource site, served
    unauthenticated at /wp-json/. This is the content management surface for the public website
    (posts, pages, resources, solutions, testimonials, people) and is not the Mantra Health clinical
    product API. The discovery document is real and machine-readable and self-describes its routes,
    namespaces and supported methods; namespaces observed include wp/v2, oembed/1.0, yoast/v1,
    jetpack/v4, wpcomsh/v1, akismet/v1, wp-block-editor/v1 and redirection/v1. Recorded because it is
    a genuine public machine-readable API on the company's own domain, and labelled so no reader
    mistakes it for a product API.
  humanURL: https://mantrahealth.com/resources/
  baseURL: https://mantrahealth.com/wp-json/
  tags:
  - Content
  - WordPress
  - CMS
