  state: gated
  reason: sales-gate
  detail: >-
    Mantra Health demonstrably runs an API — api.mantrahealth.com answers 200 with the banner
    "Mantra Health API" and serves a live Apollo GraphQL endpoint, and the company status page lists
    API, SSO and 3rd Party Integrations components — but there is no developer portal, reference or
    spec anywhere on any host, GraphQL introspection is disabled so the schema returns
    GRAPHQL_VALIDATION_FAILED for every query outside an allowed set, and the site's only route to
    access is the institutional "Get in Touch" / "Get a quote" sales form.
