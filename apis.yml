aid: mantra-health
name: Mantra Health
description: >-
  Mantra Health, Inc. is a New York-based digital mental health company that partners with colleges
  and universities to extend campus counseling centers with tele-mental health care. Its platform
  combines a partner clinic of licensed psychiatrists, therapists and wellness coaches with software
  used by students, campus staff and clinicians: the student-facing Mantra Hub, the Mantra
  Collaboration Portal used by campus counseling staff to co-manage care with Mantra providers,
  a provider portal, the Beacon offering, and ConnectNow 24/7 crisis and on-demand emotional support.
  Mantra operates a first-party API at api.mantrahealth.com backed by a GraphQL endpoint, and runs a
  public Atlassian status page whose components list an API, SSO and 3rd Party Integrations alongside
  the patient, provider, management and collaboration portals. Mantra publishes no public developer
  portal, API reference, SDK or machine-readable specification; the API is a customer/product surface
  reached through the campus contract rather than a self-serve developer program.
