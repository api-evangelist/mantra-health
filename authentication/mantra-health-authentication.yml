    validation error, so no authenticated field was ever reached and no auth mechanism was exercised.
observed_behaviour:
  anonymous_reachable: true
  anonymous_reachable_note: >-
    POST https://api.mantrahealth.com/graphql with Content-Type application/json and
    {"query":"{__typename}"} returns HTTP 200 {"data":{"__typename":"Query"}}.
  www_authenticate_header: not_present
  introspection: disabled
  introspection_note: >-
    A full introspection query and any unknown field both return HTTP 400
    {"errors":[{"message":"Invalid request.","extensions":{"code":"GRAPHQL_VALIDATION_FAILED"}}]}.
    The response is identical for a syntactically valid introspection query and for a nonsense field,
    so the server is not merely hiding the schema — it appears to reject any operation outside an
    allowed set. Consistent with an Apollo persisted-query / operation-safelist posture, but Mantra
    documents nothing, so this is recorded as an observation, not a conclusion.
  csrf_prevention: true
  csrf_prevention_note: >-
    Apollo Server CSRF prevention is enabled. A GET or a request without a JSON content-type returns
    HTTP 400 with "This operation has been blocked as a potential Cross-Site Request Forgery (CSRF).
    Please either specify a 'content-type' header ... or provide a non-empty value for one of the
    following headers: x-apollo-operation-name, apollo-require-preflight".
  cors_credentials: true
  cors_credentials_note: >-
    Response carries access-control-allow-credentials true, implying cookie/session-based browser auth
    for the first-party portals.
