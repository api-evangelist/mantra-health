  note: >-
    The credential type could not be established. The GraphQL endpoint accepts anonymous POSTs and
    returns a well-formed GraphQL response for the meta field {__typename} (-> "Query") without any
    credential, so it does not challenge unauthenticated callers at the transport layer. It returns
